# Starcup
- type: entity
  name: Dragonovaya
  parent: [BaseWeaponRifle, BaseSecurityContraband, BaseExaminableClothing] # starcup: examinable clothing
  id: WeaponRifleSecurityMarks
  description: The Dragonovaya is a Classic, brought back to use after the Neocorporate wars as multi-purpose weapon. It's seen many uses throughout it's walks of life. As a hunting rifle, as a lance when paired with a Bayonet, as an easy weapon to reach to in the hands of Militiapeople... In the end, though, it still finds itself in the hands of Security and Armed personnel, as the easy answer to the question of "How do I stop people coming close to us from afar?"
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/SDMS.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 1.8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: GunRequiresWield
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  # begin starcup: examinable clothing
  - type: ExaminableClothing
    examineText: clothing-dragonovaya
  # end starcup
