- type: entity
  name: Malinois
  parent: [BaseWeaponSubMachineGun, BaseSecurityContraband, BaseExaminableClothing] # starcup: examinable clothing
  id: WeaponSubMachineGunMalinois
  description: Robot Stop by King Gizzard and the Lizard Wizard. # starcup - NT-SC swap
  components:
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Guns/SMGs/mp5.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _starcup/Objects/Weapons/Guns/SMGs/mp5.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 6
    burstFireRate: 18
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
    selectedMode: Burst
    availableModes:
    - Burst
    - FullAuto
    - SemiAuto
    shotsPerBurst: 3
    burstCooldown: 0.375
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  # begin starcup: examinable clothing
  - type: ExaminableClothing
    examineText: clothing-malinois
  # end starcup
