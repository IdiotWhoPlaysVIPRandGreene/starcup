# Security
# starcup - removed from upstream, so here it goes
- type: entity
  id: WeaponPistolMk58Nonlethal
  parent: WeaponPistolMk58
  suffix: Non-lethal
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolRubber
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistol
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistolRubber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol

- type: entity
  name: C221 "Rattler"
  parent: [BaseWeaponPistol, BaseSecurityContraband, BaseExaminableClothing] # starcup: examinable clothing
  id: WeaponPistolC221
  description: Two Cents by RJ Lake
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/C221.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistol
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  # begin starcup: examinable clothing
  - type: ExaminableClothing
    examineText: clothing-C221
  # end starcup

- type: entity
  name: Matchlock Axe
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband, BaseExaminableClothing] # starcup: examinable clothing
  id: WeaponPistolMatchAxe
  description: Placeholder Text
  components:
  - type: Sprite
    sprite: _starcup/Objects/Weapons/Guns/Pistols/MatchAxe.rsi
    state: base
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 7.5 # IT IS a shortened Arquebus. Largely unchanged due to the big axe on the front, though.
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeAntiMateriel
    capacity: 1
    proto: CartridgeAntiMateriel # I'm kinda lending from both the Mosin (since that one's melee actually works for me) and the musket because the Axe Pistol is pretty much a shortened arquebus. May change.
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 20 # it's an axe.
        Structural: 10 # It's kinda like the swedish boarding axe. Note to self, might be good to associate with pirate faction?
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: -20 # Good luck trying to do much damage with the small tip of the axe!~
        Structural: -10 # Yeah, no. Stabbing stuff won't do much to destroy structures.
        Piercing: 3
    angle: 150
    animation: WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: AltFireMelee
    attackType: Heavy
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 2
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
  - type: Sharp
    butcherDelayModifier: 2 #It's a bayonet axe
  - type: GunRequiresWield
  - type: StaticPrice
    price: 500
  # begin starcup: examinable clothing
  - type: ExaminableClothing
    examineText: clothing-mosin
  # end starcup
